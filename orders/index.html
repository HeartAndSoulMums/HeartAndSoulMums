<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orders | Heart & Soul Signature Mums</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/orders/orders.css">
</head>
<body>
  <main id="ordersApp">
    <section id="loginView" class="login-shell">
      <div class="login-card">
        <img src="/heart-and-soul-logo.jpeg" alt="Heart & Soul Signature Mums">
        <span class="eyebrow">OWNER ACCESS</span>
        <h1>Orders Dashboard</h1>
        <p>Enter the private owner dashboard password to view customer orders.</p>
        <form id="loginForm">
          <label>Owner password
            <input id="ownerKey" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit">Open Orders</button>
          <p id="loginError" class="error" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section id="dashboardView" hidden>
      <header class="topbar">
        <div class="brand">
          <img src="/heart-and-soul-logo.jpeg" alt="">
          <div><strong>Heart & Soul</strong><span>Orders Dashboard</span></div>
        </div>
        <div class="top-actions">
          <a href="/admin/" class="secondary-btn">Website Editor</a>
          <button id="refreshBtn" class="secondary-btn">Refresh</button>
          <button id="lockBtn" class="secondary-btn">Lock</button>
        </div>
      </header>

      <div class="dashboard">
        <section class="dashboard-head">
          <div>
            <span class="eyebrow">ORDER MANAGEMENT</span>
            <h1>Customer Orders</h1>
            <p>Review details, contact customers, and move orders through production.</p>
          </div>
          <div id="lastUpdated" class="updated"></div>
        </section>

        <section class="stats" id="stats"></section>

        <section class="controls">
          <input id="searchInput" type="search" placeholder="Search student, customer, school, order #, promo code…">
          <select id="statusFilter">
            <option value="All">All statuses</option>
            <option>New</option>
            <option>Design Approved</option>
            <option>In Production</option>
            <option>Ready for Pickup</option>
            <option>Completed</option>
            <option>Cancelled</option>
          </select>
        </section>

        <div id="loadingState" class="state-card">Loading orders…</div>
        <div id="errorState" class="state-card error-card" hidden></div>
        <section id="ordersList" class="orders-list"></section>
        <div id="emptyState" class="state-card" hidden>No orders match your filters.</div>
      </div>
    </section>
  </main>

  <dialog id="orderDialog">
    <button id="closeDialog" class="close" aria-label="Close">×</button>
    <div id="orderDetail"></div>
  </dialog>

  <script src="/orders/orders.js"></script>
</body>
</html>
