backend:
  name: github
  repo: HeartAndSoulMums/HeartAndSoulMums
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "website"
    label: "Owner Controls"
    files:
      - name: "site_settings"
        label: "Heart & Soul — Owner Controls"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "Branding & Contact"
            name: "branding"
            widget: "object"
            fields:
              - { label: "Business name", name: "business_name", widget: "string" }
              - { label: "Website logo", name: "logo", widget: "image", hint: "Upload/replace the main logo used throughout the site." }
              - { label: "Short tagline", name: "tagline", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "Pickup / service area", name: "service_area", widget: "string", required: false }

          - label: "Announcement Bar"
            name: "announcement"
            widget: "object"
            fields:
              - { label: "Show announcement", name: "enabled", widget: "boolean", default: false }
              - { label: "Message", name: "text", widget: "string", required: false, hint: "Example: Now accepting orders for 2026 Homecoming!" }

          - label: "Homepage Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Small heading", name: "eyebrow", widget: "string" }
              - { label: "Main title", name: "title_before", widget: "string" }
              - { label: "Highlighted title", name: "title_emphasis", widget: "string" }
              - { label: "Intro text", name: "body", widget: "text" }

          - label: "Why Heart & Soul"
            name: "difference"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Tagline", name: "tagline", widget: "string" }

          - label: "Mum Packages"
            name: "packages"
            widget: "object"
            fields:
              - label: "Mini Mum"
                name: "Mini Mum"
                widget: "object"
                fields: &package_fields
                  - { label: "Starting price", name: "price", widget: "number", value_type: "int", min: 0 }
                  - { label: "Small label", name: "label", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - { label: "Garter", name: "Garter", widget: "object", fields: *package_fields }
              - { label: "Classic", name: "Classic", widget: "object", fields: *package_fields }
              - { label: "Signature", name: "Signature", widget: "object", fields: *package_fields }
              - { label: "Signature Plus", name: "Signature Plus", widget: "object", fields: *package_fields }
              - { label: "Showstopper", name: "Showstopper", widget: "object", fields: *package_fields }

          - label: "Pricing Options"
            name: "pricing"
            widget: "object"
            fields:
              - label: "Length prices"
                name: "lengths"
                widget: "object"
                fields:
                  - { label: "Standard", name: "Standard", widget: "number", value_type: "int" }
                  - { label: "Long", name: "Long", widget: "number", value_type: "int" }
                  - { label: "Extra Long", name: "Extra Long", widget: "number", value_type: "int" }
              - label: "Fullness prices"
                name: "fullness"
                widget: "object"
                fields:
                  - { label: "Standard", name: "Standard", widget: "number", value_type: "int" }
                  - { label: "Xtra Full", name: "Xtra Full", widget: "number", value_type: "int" }
              - label: "Add-on prices"
                name: "addons"
                widget: "object"
                fields:
                  - { label: "Light It Up", name: "Light It Up Package", widget: "number", value_type: "int" }
                  - { label: "Bling", name: "Bling Package", widget: "number", value_type: "int" }
                  - { label: "Feather Package", name: "Feather Package", widget: "number", value_type: "int" }
                  - { label: "Charm Package", name: "Charm Package", widget: "number", value_type: "int" }
                  - { label: "Photo", name: "Photo Package", widget: "number", value_type: "int" }
                  - { label: "Sweetheart Package", name: "Sweetheart Package", widget: "number", value_type: "int" }
                  - { label: "Stuffed Animal", name: "Stuffed Animal", widget: "number", value_type: "int" }
                  - { label: "Extra Words checkbox base", name: "Extra Words", widget: "number", value_type: "int", hint: "Keep at 0; per-word price is set below." }
              - label: "Braid prices"
                name: "braids"
                widget: "object"
                fields:
                  - { label: "None", name: "None", widget: "number", value_type: "int" }
                  - { label: "Simple Braid", name: "Simple Braid", widget: "number", value_type: "int" }
                  - { label: "Thick Braid", name: "Thick Braid", widget: "number", value_type: "int" }
              - label: "Custom printed ribbon prices"
                name: "printed_ribbon"
                widget: "object"
                fields:
                  - { label: "None", name: "None", widget: "number", value_type: "int" }
                  - { label: "1 custom ribbon", name: "1 custom ribbon", widget: "number", value_type: "int" }
                  - { label: "2 custom ribbons", name: "2 custom ribbons", widget: "number", value_type: "int" }
                  - { label: "3 custom ribbons", name: "3 custom ribbons", widget: "number", value_type: "int" }
              - { label: "Add School Name on Ribbon price", name: "school_name_ribbon", widget: "number", value_type: "int" }
              - { label: "Extra word price (each)", name: "extra_word_each", widget: "number", value_type: "int" }

          - label: "Ordering Settings"
            name: "ordering"
            widget: "object"
            fields:
              - { label: "Accepting new orders", name: "accepting_orders", widget: "boolean", default: true }
              - { label: "Closed-order message", name: "closed_message", widget: "string", required: false }
              - { label: "Minimum lead time (days)", name: "minimum_lead_days", widget: "number", value_type: "int", min: 0 }
              - { label: "Payment policy", name: "payment_policy", widget: "text" }
              - { label: "Refund policy", name: "refund_policy", widget: "text" }
              - { label: "Pickup instructions", name: "pickup_instructions", widget: "text", required: false }

          - label: "Student Referral Codes"
            name: "referral"
            widget: "object"
            fields:
              - { label: "Customer discount percent", name: "discount_percent", widget: "number", value_type: "int", min: 0, max: 100 }
              - { label: "Paid orders needed for reward", name: "reward_orders", widget: "number", value_type: "int", min: 1 }
              - { label: "Reward description", name: "reward_text", widget: "string" }
              - label: "Approved promo codes"
                name: "codes"
                widget: "list"
                summary: "{{fields.code}} — {{fields.student}} ({{fields.school}})"
                fields:
                  - { label: "Code", name: "code", widget: "string" }
                  - { label: "Student", name: "student", widget: "string" }
                  - { label: "School", name: "school", widget: "string" }
                  - { label: "Active", name: "active", widget: "boolean", default: true }

          - label: "Senior Section"
            name: "senior"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }

          - label: "Policies"
            name: "policies"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Policy text", name: "body", widget: "text" }

          - label: "Rush Pricing"
            name: "rush"
            widget: "list"
            fields:
              - { label: "Time window", name: "window", widget: "string" }
              - { label: "Fee", name: "fee", widget: "string" }

          - label: "Photo Gallery"
            name: "gallery"
            widget: "list"
            required: false
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }

          - { label: "Footer text", name: "footer_text", widget: "string" }
